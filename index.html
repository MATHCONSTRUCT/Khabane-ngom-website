<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Khabane Ngom — Mathematics"><title>Khabane Ngom | Mathematics</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="brand" href="#home" data-page="home"><strong id="brand-name">Khabane Ngom</strong><span>MATHEMATICS</span></a><nav aria-label="Primary navigation"><a href="#home" data-page="home" class="active">Home</a><a href="#research" data-page="research">Research</a><a href="#publications" data-page="publications">Publications</a><a href="#teaching" data-page="teaching">Teaching</a><a href="#talks" data-page="talks">Talks</a><a href="#cv" data-page="cv">CV</a><a href="#contact" data-page="contact">Contact</a></nav><div class="field-mark" id="field-mark">NUMBER THEORY  /  NORMAL NUMBERS</div></header>
<main id="app" aria-live="polite"></main><footer><span>© <span id="year"></span> <span id="footer-name">Khabane Ngom</span></span><span>Mathematics · Number Theory · Normal Numbers</span></footer>
<script>
const fallback={profile:{name:'Khabane Ngom',subtitle:'PhD Student in Mathematics',intro:"I'm a PhD student in Mathematics at Cheikh Anta Diop University, working in number theory with a focus on normal numbers.",field_mark:'NUMBER THEORY  /  NORMAL NUMBERS',hero_image:'uploads/normal-numbers-fractal.png'},research:{intro:'My research is in number theory, with a focus on normal numbers, digit expansions and related questions.',topics:[{title:'Normal numbers',text:'Normality and simple normality in integer bases, digit expansions, and explicit constructions.'},{title:'Number theory',text:'Questions in number theory related to distribution of digits and normality properties.'}]},publications:[],teaching:[],talks:[],cv:{file:'',description:'Curriculum Vitae — Khabane Ngom'},contact:{email:'',affiliation:'',extra:''}};
let data=fallback;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>url?`<a class="text-link" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`:'';
function pages(){return {
home:`<section class="home-shell"><div class="home-copy"><p class="eyebrow">NUMBER THEORY · DIGITS · NORMALITY</p><h1>${esc(data.profile.name)}</h1><h2>${esc(data.profile.subtitle)}</h2><div class="rule"></div><p class="intro">${esc(data.profile.intro)}</p><a class="button" href="#research" data-page="research">Learn more <span>→</span></a></div><div class="hero-photo"><img src="${esc(data.profile.hero_image)}" alt="Mathematics"><div class="photo-wash"></div></div></section><section class="home-cards"><a href="#research" data-page="research"><strong>Research</strong><small>Normal numbers, digits and number theory.</small></a><a href="#publications" data-page="publications"><strong>Publications</strong><small>Articles and preprints.</small></a><a href="#teaching" data-page="teaching"><strong>Teaching</strong><small>Courses and supervision.</small></a><a href="#talks" data-page="talks"><strong>Talks</strong><small>Conferences and seminars.</small></a><a href="#cv" data-page="cv"><strong>CV</strong><small>Curriculum vitae.</small></a><a href="#contact" data-page="contact"><strong>Contact</strong><small>Get in touch.</small></a></section>`,
research:`<section class="page"><p class="page-no">RESEARCH</p><h1>Research</h1><div class="hairline"></div><p class="lead">${esc(data.research.intro)}</p><div class="topic-grid">${(data.research.topics||[]).map(x=>`<article><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></article>`).join('')}</div></section>`,
publications:`<section class="page"><p class="page-no">PUBLICATIONS</p><h1>Publications</h1><div class="hairline"></div>${data.publications?.length?data.publications.map((p,i)=>`<div class="empty-entry"><span>${String(i+1).padStart(2,'0')}</span><p><strong>${esc(p.authors)}</strong>, “${esc(p.title)}”${p.journal?', <em>'+esc(p.journal)+'</em>':''}${p.year?', '+esc(p.year):''}. ${link(p.url,'Link')} ${link(p.pdf,'PDF')}</p></div>`).join(''):'<p class="note">Publications will appear here.</p>'}</section>`,
teaching:`<section class="page"><p class="page-no">TEACHING</p><h1>Teaching</h1><div class="hairline"></div>${data.teaching?.length?data.teaching.map(t=>`<div class="teaching-row"><time>${esc(t.year)}</time><div><strong>${esc(t.course)}</strong><p>${esc(t.institution||'')}${t.description?' · '+esc(t.description):''} ${link(t.file,'Material')}</p></div></div>`).join(''):'<p class="note">Teaching activities will appear here.</p>'}</section>`,
talks:`<section class="page"><p class="page-no">TALKS · CONFERENCES</p><h1>Talks & Conferences</h1><div class="hairline"></div><div class="timeline">${data.talks?.length?data.talks.map(t=>`<p><time>${esc(t.year)}</time><span>${esc(t.title)}${t.place?' — '+esc(t.place):''} ${link(t.url,'Link')}</span></p>`).join(''):'<p class="note">Talks and conferences will appear here.</p>'}</div></section>`,
cv:`<section class="page"><p class="page-no">CURRICULUM VITAE</p><h1>CV</h1><div class="hairline"></div><div class="cv-box"><strong>${esc(data.cv.description||'Curriculum Vitae')}</strong>${data.cv.file?`<p><a class="button" href="${esc(data.cv.file)}" target="_blank" rel="noopener">Open / Download CV</a></p>`:'<p>CV PDF to be added from the administration page.</p>'}</div></section>`,
contact:`<section class="page"><p class="page-no">CONTACT</p><h1>Contact</h1><div class="hairline"></div><div class="contact-block"><p><strong>${esc(data.profile.name)}</strong><br>${esc(data.contact.affiliation||'')}</p>${data.contact.email?`<p><a class="text-link" href="mailto:${esc(data.contact.email)}">${esc(data.contact.email)}</a></p>`:''}${data.contact.extra?`<p>${esc(data.contact.extra)}</p>`:''}</div></section>`};}
function render(name){const p=pages();if(!p[name])name='home';document.getElementById('app').innerHTML=p[name];document.querySelectorAll('[data-page]').forEach(a=>a.classList.toggle('active',a.dataset.page===name));document.title=(name==='home'?data.profile.name:name[0].toUpperCase()+name.slice(1)+' — '+data.profile.name);window.scrollTo(0,0)}
async function init(){try{const r=await fetch('content/site.json',{cache:'no-store'});if(r.ok)data=await r.json()}catch(e){}document.getElementById('brand-name').textContent=data.profile.name;document.getElementById('footer-name').textContent=data.profile.name;document.getElementById('field-mark').textContent=data.profile.field_mark;document.getElementById('year').textContent=new Date().getFullYear();render(location.hash.slice(1)||'home')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-page]');if(a){e.preventDefault();const p=a.dataset.page;history.pushState({p},'',`#${p}`);render(p)}});window.addEventListener('popstate',()=>render(location.hash.slice(1)||'home'));init();
</script></body></html>
